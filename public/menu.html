<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Coffee - Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="name">ELITE COFFEE</div>
        <nav>
            <ul class="menu">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/menu">Menu</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Centered Intro Box with background card -->
        <div class="intro">
            <h1>Our Menu</h1>
            <h2>Explore our handcrafted blends</h2>
        </div>
        
        <section class="products" id="menu-container">
            <!-- Dynamically populated via API fetch -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ELITE COFFEE | Contact: info@elitecoffee.com</p>
    </footer>

    <script>
    fetch('/api/coffee')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            data.forEach(item => {
                container.innerHTML += `
                    <div class="item">
                        <img src="${item.image}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                    </div>
                `;
            });
        })
        .catch(err => console.error("Error loading menu:", err));
    </script>
</body>
</html>
